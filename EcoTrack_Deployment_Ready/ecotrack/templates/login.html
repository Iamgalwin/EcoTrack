{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto;" class="card">
    <h2 style="text-align: center; color: var(--green); margin-bottom: 20px;"><i class="fa-solid fa-leaf"></i> EcoTrack Login</h2>
    <form action="/login" method="POST">
        <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn" style="margin-bottom: 12px;">Sign In</button>
    </form>
    
    <hr style="border-color: var(--border); margin: 20px 0;">
    <h4 style="text-align: center; margin-bottom: 12px;">New Account? Register</h4>
    <form action="/register" method="POST">
        <div class="form-group"><label>Choose Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="form-group"><label>Choose Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn" style="background: #3b82f6; color: #fff;">Register</button>
    </form>
</div>
{% endblock %}
